name: GitHub activity card

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build stats SVGs
        env:
          # Optional STATS_TOKEN (a personal token) lets the card include private repo languages.
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_LOGIN: ${{ github.repository_owner }}
        run: node scripts/github-stats.mjs

      # The script leaves the SVGs untouched when only the "UPDATED <date>" line would change,
      # so this commits only when the stats themselves changed.
      - name: Commit if changed
        run: |
          if git diff --quiet -- assets/stats-dark.svg assets/stats-light.svg; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats-dark.svg assets/stats-light.svg
          git commit -m "stats: daily update"
          git push
